name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy configuration
        env:
          WIF_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "::error::WORKLOAD_IDENTITY_PROVIDER repository variable is not set. See docs/DEPLOY_FUNCTIONS.md."
            exit 1
          fi

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-functions-deploy@im-rounding-tracker.iam.gserviceaccount.com

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy functions
        run: npx firebase-tools@latest deploy --only functions --project im-rounding-tracker --non-interactive --force
